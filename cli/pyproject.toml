[project]
name = "sitecrawl"
version = "1.0.0"
description = "Bounded, robots-aware website crawler CLI (SiteScout)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "selectolax>=1.0"]

[project.scripts]
sitecrawl = "sitecrawl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sitecrawl"]
